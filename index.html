<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepT Image Resizer</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>🖼️ DeepT Image Resizer</h1>
<p class="subtitle">Resize & Compress Images Online Free</p>

<div class="upload-box" id="dropArea">

<input type="file" id="imageInput" accept="image/*" hidden>

<p>📂 Drag & Drop Image Here</p>

<button id="chooseBtn">Choose Image</button>

</div>

<div class="preview">

<img id="previewImage">

</div>

<div class="controls">

<div>
<label>Width (px)</label>
<input type="number" id="width">
</div>

<div>
<label>Height (px)</label>
<input type="number" id="height">
</div>

<div>
<label>Quality</label>
<input type="range" id="quality" min="10" max="100" value="90">
</div>

<div>
<label>Format</label>

<select id="format">
<option value="image/png">PNG</option>
<option value="image/jpeg">JPG</option>
<option value="image/webp">WEBP</option>
</select>

</div>

<button id="resizeBtn">Resize Image</button>

<a id="downloadBtn">
<button>Download</button>
</a>

</div>

</div>

<!-- JPG to PDF Tool -->
<section class="tool-card">
  ...
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
