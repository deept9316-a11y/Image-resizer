<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover - ToolHub</title>
    <link rel="stylesheet" href="style.css">
    <!-- imgly background removal library -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
    <style>
        .tool-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #007bff;
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
            background: #f8f9fa;
            margin-bottom: 20px;
        }
        .upload-area input { display: none; }
        .preview-box {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .img-card {
            flex: 1;
            min-width: 250px;
            max-width: 350px;
        }
        .img-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-image: repeating-linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc), repeating-linear-gradient(45deg, #ccc 25%, #fff 25%, #fff 75%, #ccc 75%, #ccc);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 1.1em; color: #555; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">🛠️ ToolHub</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#tools-section">All Tools</a>
        </nav>
    </header>

    <main class="container">
        <div class="tool-container">
            <h1>AI Background Remover</h1>
            <p>Select an image to automatically remove its background locally in your browser.</p>

            <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                <h3>📁 Click or Drag & Drop Image Here</h3>
                <p>Supports JPG, PNG, WEBP</p>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div id="status" class="status"></div>

            <div class="preview-box" id="previewBox" style="display: none;">
                <div class="img-card">
                    <h4>Original Image</h4>
                    <img id="originalImg" src="" alt="Original">
                </div>
                <div class="img-card">
                    <h4>Result (No Background)</h4>
                    <img id="resultImg" src="" alt="Result">
                    <a id="downloadBtn" download="no-bg.png" class="btn" style="display: none;">Download PNG</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const imageInput = document.getElementById('imageInput');
        const statusDiv = document.getElementById('status');
        const previewBox = document.getElementById('previewBox');
        const originalImg = document.getElementById('originalImg');
        const resultImg = document.getElementById('resultImg');
        const downloadBtn = document.getElementById('downloadBtn');

        imageInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Display Original Image
            originalImg.src = URL.createObjectURL(file);
            previewBox.style.display = 'flex';
            resultImg.src = '';
            downloadBtn.style.display = 'none';

            statusDiv.innerHTML = '<span class="spinner"></span> Processing... Loading AI model (First time may take a few seconds)...';

            try {
                // Remove background using Client-Side AI Model
                const blob = await imglyRemoveBackground(file);
                const resultUrl = URL.createObjectURL(blob);

                resultImg.src = resultUrl;
                downloadBtn.href = resultUrl;
                downloadBtn.style.display = 'inline-block';
                statusDiv.innerHTML = '✅ Background removed successfully!';
            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = '❌ Error processing image. Please try another image.';
            }
        });
    </script>
</body>
</html>
